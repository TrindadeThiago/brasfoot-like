<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações — Treinador FC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0e13}
a{color:inherit;text-decoration:none}
a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 980px; background: #0a0e13; color: #eef2f6; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column">

  <header style="padding: 16px 48px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #1d2733">
    <a href="Menu.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #b4c0cd; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      Voltar
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Configurações</h1>
  </header>

  <main style="width: 100%; max-width: 760px; margin: 0 auto; padding: 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

    <section aria-labelledby="live" style="background: #121922; border: 1px solid #1d2733; border-radius: 16px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
      <h2 id="live" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Rodada ao vivo</h2>
      <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 500">
        Velocidade padrão
        <select style="min-height: 48px; max-width: 320px; border-radius: 10px; border: 1px solid #2e3a47; background: #0f151c; color: #eef2f6; padding: 0 12px; font: inherit"><option>Normal</option><option>Rápido</option><option>Muito rápido</option></select>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px">
        <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #3ddc84">
        Pausar quando meu time tiver lesão ou expulsão
      </label>
    </section>

    <section aria-labelledby="look" style="background: #121922; border: 1px solid #1d2733; border-radius: 16px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
      <h2 id="look" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Aparência e idioma</h2>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-weight: 500">Tema</div>
        <div role="group" aria-label="Tema" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{themes}}" as="o" hint-placeholder-count="3">
            <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.style}}">{{o.label}}</button>
          </sc-for>
        </div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 500">
        Idioma
        <select style="min-height: 48px; max-width: 320px; border-radius: 10px; border: 1px solid #2e3a47; background: #0f151c; color: #eef2f6; padding: 0 12px; font: inherit"><option>Português (Brasil)</option></select>
      </label>
    </section>

    <section aria-labelledby="tips" style="background: #121922; border: 1px solid #1d2733; border-radius: 16px; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px">
      <h2 id="tips" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Dicas</h2>
      <div style="color: #98a6b6">As dicas explicam cada tela na primeira visita. Você pode vê-las de novo quando quiser.</div>
      <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #2e3a47; background: #0f151c; color: #eef2f6; font: inherit; font-weight: 500; cursor: pointer">Mostrar as dicas de novo</button>
    </section>

    <section aria-labelledby="about" style="background: #121922; border: 1px solid #1d2733; border-radius: 16px; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px">
      <h2 id="about" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Sobre</h2>
      <div>Treinador FC · versão 1.10.0</div>
      <div style="display: flex; gap: 20px; flex-wrap: wrap">
        <a href="NotasVersao.dc.html" style="color: {{accent}}; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center">Notas de versão</a>
        <a href="Sobre.dc.html" style="color: {{accent}}; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center">Sobre o jogo</a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3ddc84","options":["#3ddc84","#5ec8ff","#ffb454","#c79bff"]}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#3ddc84';
    const theme = (this.state && this.state.theme) || 'Escuro';
    const themes = ['Escuro', 'Claro', 'Sistema'].map((label) => ({
      label,
      on: theme === label ? 'true' : 'false',
      pick: () => this.setState({ theme: label }),
      style: 'min-height:44px;padding:0 18px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;' +
        (theme === label ? 'background:' + accent + ';color:#06140c;border:1px solid ' + accent + ';' : 'background:#0f151c;color:#eef2f6;border:1px solid #2e3a47;'),
    }));
    return { accent, themes };
  }
}
</script>
</body>
</html>
