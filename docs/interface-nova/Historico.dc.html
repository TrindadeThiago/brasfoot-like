<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Histórico — Treinador FC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0e13}
a{color:inherit;text-decoration:none}
a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 980px; background: #0a0e13; color: #eef2f6; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.45; display: flex; flex-wrap: wrap">

  <nav aria-label="Telas do jogo" style="flex: 1 1 232px; max-width: 100%; min-width: 0; background: #0f151c; border-right: 1px solid #1d2733; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: {{accent}}; color: #06140c; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px">T</div>
      <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: -0.01em">Treinador FC</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
        <a href="{{n.href}}" style="{{n.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
          <span style="flex: 1 1 auto">{{n.label}}</span>
          <sc-if value="{{n.badge}}" hint-placeholder-val="{{ false }}">
            <span style="background: #ffb454; color: #1a1103; border-radius: 99px; font-size: 11px; font-weight: 600; padding: 1px 7px">{{n.badge}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
    <div style="margin-top: auto; border-top: 1px solid #1d2733; padding-top: 12px; display: flex; flex-direction: column; gap: 2px">
      <a href="Menu.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; color: #98a6b6; font-weight: 500">Menu inicial</a>
      <a href="Configuracoes.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; color: #98a6b6; font-weight: 500">Configurações</a>
      <a href="#" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; color: #98a6b6; font-weight: 500">Atalhos de teclado</a>
    </div>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; justify-content: space-between">
      <div>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Histórico</h1>
        <div style="color: #98a6b6">Campeões, artilheiros e recordes do mundo</div>
      </div>
      <a href="Carreira.dc.html" style="color: {{accent}}; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center">Ver a trajetória do técnico</a>
    </header>

    <div role="tablist" aria-label="Seções do histórico" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
        <button type="button" role="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <section style="background: #121922; border: 1px dashed #2e3a47; border-radius: 16px; padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#98a6b6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 2M3 12a9 9 0 1 0 3-6.7M3 4v5h5"></path></svg>
        <div style="font-weight: 600; font-size: 16px">{{emptyTitle}}</div>
        <div style="color: #98a6b6; max-width: 46ch">{{emptyText}}</div>
      </section>
    </sc-if>

    <sc-if value="{{hasData}}" hint-placeholder-val="{{ true }}">
      <section aria-label="{{caption}}" style="background: #121922; border: 1px solid #1d2733; border-radius: 16px; overflow-x: auto">
        <table style="width: 100%; min-width: 560px; border-collapse: collapse; font-variant-numeric: tabular-nums">
          <caption style="text-align: left; padding: 16px 20px 4px; color: #98a6b6; font-size: 13px">{{caption}}</caption>
          <thead>
            <tr style="color: #98a6b6; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">
              <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
                <th scope="col" style="text-align: left; padding: 12px 20px; font-weight: 500">{{c.label}}</th>
              </sc-for>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
              <tr style="{{r.style}}">
                <sc-for list="{{r.cells}}" as="cell" hint-placeholder-count="4">
                  <td style="padding: 12px 20px; {{cell.style}}">{{cell.text}}</td>
                </sc-for>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3ddc84","options":["#3ddc84","#5ec8ff","#ffb454","#c79bff"]},"state":{"editor":"enum","default":"com dados","options":["com dados","sem dados"],"section":"Estado"}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#3ddc84';
    const withData = (this.props.state ?? 'com dados') === 'com dados';
    const tab = (this.state && this.state.tab) || 'Temporadas';
    const base = 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;box-sizing:border-box;';
    const items = [
      ['Início', 'Main.dc.html', 'M3 11l9-8 9 8M5 10v10h14V10'],
      ['Elenco', 'Elenco.dc.html', 'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-2a4 4 0 0 0-3-3.9M16 2.1a4 4 0 0 1 0 7.8'],
      ['Escalação', 'Escalacao.dc.html', 'M3 5h18v14H3zM12 5v14M3 12h18'],
      ['Competição', 'Competicao.dc.html', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3'],
      ['Calendário', 'Calendario.dc.html', 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],
      ['Finanças', 'Financas.dc.html', 'M3 17l6-6 4 4 8-8M15 7h6v6'],
      ['Histórico', 'Historico.dc.html', 'M12 8v4l3 2M3 12a9 9 0 1 0 3-6.7M3 4v5h5', true],
      ['Mercado', 'Mercado.dc.html', 'M4 7h16l-1.5 12h-13zM9 7a3 3 0 0 1 6 0'],
      ['Carreira', 'Carreira.dc.html', 'M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8'],
      ['Notícias', 'Noticias.dc.html', 'M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5'],
    ];
    const nav = items.map((it) => ({
      label: it[0], href: it[1], icon: it[2], badge: it[4] || '',
      style: base + (it[3] ? 'background:#16222c;color:' + accent + ';font-weight:600;' : 'color:#b4c0cd;font-weight:500;'),
    }));
    const names = ['Temporadas', 'Títulos', 'Artilheiros', 'Recordes', 'Clubes', 'Copas', 'Continental'];
    const tabs = names.map((name) => ({
      label: name,
      pick: () => this.setState({ tab: name }),
      style: 'min-height:44px;padding:0 16px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;' +
        (tab === name ? 'background:' + accent + ';color:#06140c;border:1px solid ' + accent + ';' : 'background:#121922;color:#eef2f6;border:1px solid #2e3a47;'),
    }));
    const defs = {
      Temporadas: { caption: 'Temporadas encerradas', cols: ['Temporada', 'Campeão da Série A', 'Seu clube', 'Artilheiro'], rows: [['2027', 'Estrela do Norte', '2º na Série A', 'Rafael Nunes (21 gols)'], ['2026', 'Estrela do Norte', '3º na Série A', 'Heitor Dias (19 gols)'], ['2025', 'Atlético Marítimo', '7º na Série A', 'Cauã Reis (17 gols)']], mine: 2 },
      Títulos: { caption: 'Títulos da Série A', cols: ['Clube', 'Títulos', 'Anos'], rows: [['Estrela do Norte', '2', '2026, 2027'], ['Atlético Marítimo', '1', '2025']] },
      Artilheiros: { caption: 'Artilheiros históricos da liga', cols: ['Jogador', 'Gols', 'Jogos'], rows: [['Rafael Nunes', '34', '66'], ['Heitor Dias', '29', '64'], ['Cauã Reis', '24', '61']] },
      Recordes: { caption: 'Recordes da liga', cols: ['Recorde', 'Marca', 'Ano'], rows: [['Maior vitória', 'Estrela do Norte 6 × 0 Comercial FC', '2026'], ['Mais pontos numa temporada', 'Estrela do Norte: 89 pontos', '2027'], ['Maior sequência de vitórias', 'Atlético Marítimo: 11 vitórias', '2025']] },
      Clubes: { caption: 'Títulos e lendas do clube', cols: ['Lendas: mais gols pelo clube', 'Gols'], rows: [['Rafael Nunes', '34'], ['Gabriel Lins', '18'], ['Bruno Faria', '12']] },
      Copas: { caption: 'Copa Nacional do Brasil', cols: ['Temporada', 'Campeão', 'Vice'], rows: [['2027', 'Varginha Unidos', 'Bagé Unidos'], ['2026', 'Bagé Unidos', 'União Canoas']] },
      Continental: { caption: 'Taça Continental da América do Sul', cols: ['Temporada', 'Campeão', 'Seu clube'], rows: [['2027', 'Porto Oeste', 'Fase de grupos'], ['2026', 'Atlético Marítimo', 'Não classificado']] },
    };
    const def = defs[tab];
    const rows = def.rows.map((r, i) => ({
      style: 'border-top:1px solid #1d2733;' + (def.mine === i ? 'background:#16222c;' : ''),
      cells: r.map((text, k) => ({ text, style: k === 0 ? 'font-weight:600;' : 'color:#b4c0cd;' })),
    }));
    const emptyCopy = {
      Temporadas: ['Nenhuma temporada encerrada ainda.', 'As temporadas aparecem aqui quando a primeira terminar.'],
      Artilheiros: ['Sem artilheiros históricos ainda.', 'Os artilheiros históricos aparecem depois da primeira temporada encerrada.'],
      Recordes: ['Nenhum recorde registrado ainda.', 'Os recordes surgem conforme as rodadas são jogadas.'],
      Clubes: ['As lendas aparecem depois da primeira temporada encerrada.', 'Escolha um clube para ver os títulos e as lendas dele.'],
    };
    const ec = emptyCopy[tab] || ['Nenhuma temporada encerrada ainda.', 'Esta seção é preenchida a partir da primeira temporada encerrada.'];
    return {
      accent, nav, tabs, caption: def.caption,
      cols: def.cols.map((label) => ({ label })), rows,
      hasData: withData, empty: !withData, emptyTitle: ec[0], emptyText: ec[1],
    };
  }
}
</script>
</body>
</html>
