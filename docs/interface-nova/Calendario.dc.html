<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Calendário — Treinador FC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0e13}
a{color:inherit;text-decoration:none}
a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 980px; background: #0a0e13; color: #eef2f6; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.45; display: flex; flex-wrap: wrap">

  <nav aria-label="Telas do jogo" style="flex: 1 1 232px; max-width: 100%; min-width: 0; background: #0f151c; border-right: 1px solid #1d2733; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: {{accent}}; color: #06140c; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px">T</div>
      <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: -0.01em">Treinador FC</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
        <a href="{{n.href}}" style="{{n.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
          <span style="flex: 1 1 auto">{{n.label}}</span>
          <sc-if value="{{n.badge}}" hint-placeholder-val="{{ false }}">
            <span style="background: #ffb454; color: #1a1103; border-radius: 99px; font-size: 11px; font-weight: 600; padding: 1px 7px">{{n.badge}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
    <div style="margin-top: auto; border-top: 1px solid #1d2733; padding-top: 12px; display: flex; flex-direction: column; gap: 2px">
      <a href="Menu.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; color: #98a6b6; font-weight: 500">Menu inicial</a>
      <a href="Configuracoes.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; color: #98a6b6; font-weight: 500">Configurações</a>
      <a href="#" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; color: #98a6b6; font-weight: 500">Atalhos de teclado</a>
    </div>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; justify-content: space-between">
      <div>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Calendário</h1>
        <div style="color: #98a6b6">Jogos do União Canoas na temporada 2026</div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end">
        <label style="display: flex; flex-direction: column; gap: 4px; color: #98a6b6; font-size: 12px">
          Competição
          <select style="min-height: 44px; border-radius: 10px; border: 1px solid #2e3a47; background: #121922; color: #eef2f6; padding: 0 12px; font: inherit"><option>Todas as competições</option><option>Campeonato Nacional do Brasil</option><option>Campeonato Estadual do Rio Grande do Sul</option><option>Copa Nacional do Brasil</option></select>
        </label>
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
          <button type="button" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
    </header>

    <section aria-label="Jogos" style="background: #121922; border: 1px solid #1d2733; border-radius: 16px; padding: 8px 20px">
      <sc-for list="{{games}}" as="g" hint-placeholder-count="8">
        <div style="{{g.rowStyle}}">
          <div style="width: 64px; flex: 0 0 auto">
            <div style="color: #98a6b6; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em">Rodada</div>
            <div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">{{g.round}}</div>
          </div>
          <span style="{{g.venue}}">{{g.where}}</span>
          <span style="flex: 1 1 160px; min-width: 0; font-weight: 500">{{g.opponent}}<span style="display: block; color: #98a6b6; font-size: 12px; font-weight: 400">{{g.comp}}</span></span>
          <span style="{{g.result}}">{{g.text}}</span>
          <div style="display: flex; gap: 6px">
            <sc-if value="{{g.played}}" hint-placeholder-val="{{ false }}">
              <button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #2e3a47; background: #0f151c; color: #eef2f6; font: inherit; font-weight: 500; cursor: pointer">Resumo</button>
            </sc-if>
            <button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #2e3a47; background: #0f151c; color: #eef2f6; font: inherit; font-weight: 500; cursor: pointer">Ver jogos</button>
          </div>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3ddc84","options":["#3ddc84","#5ec8ff","#ffb454","#c79bff"]}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#3ddc84';
    const filter = (this.state && this.state.filter) || 'Todos';
    const base = 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;box-sizing:border-box;';
    const items = [
      ['Início', 'Main.dc.html', 'M3 11l9-8 9 8M5 10v10h14V10'],
      ['Elenco', 'Elenco.dc.html', 'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-2a4 4 0 0 0-3-3.9M16 2.1a4 4 0 0 1 0 7.8'],
      ['Escalação', 'Escalacao.dc.html', 'M3 5h18v14H3zM12 5v14M3 12h18'],
      ['Competição', 'Competicao.dc.html', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3'],
      ['Calendário', 'Calendario.dc.html', 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', true],
      ['Finanças', 'Financas.dc.html', 'M3 17l6-6 4 4 8-8M15 7h6v6'],
      ['Histórico', 'Historico.dc.html', 'M12 8v4l3 2M3 12a9 9 0 1 0 3-6.7M3 4v5h5'],
      ['Mercado', 'Mercado.dc.html', 'M4 7h16l-1.5 12h-13zM9 7a3 3 0 0 1 6 0'],
      ['Carreira', 'Carreira.dc.html', 'M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8'],
      ['Notícias', 'Noticias.dc.html', 'M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5', false, '3'],
    ];
    const nav = items.map((it) => ({
      label: it[0], href: it[1], icon: it[2], badge: it[4] || '',
      style: base + (it[3] ? 'background:#16222c;color:' + accent + ';font-weight:600;' : 'color:#b4c0cd;font-weight:500;'),
    }));
    const filters = ['Todos', 'Em casa', 'Fora'].map((name) => ({
      label: name,
      pick: () => this.setState({ filter: name }),
      style: 'min-height:44px;padding:0 16px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;' +
        (filter === name ? 'background:' + accent + ';color:#06140c;border:1px solid ' + accent + ';' : 'background:#121922;color:#eef2f6;border:1px solid #2e3a47;'),
    }));
    const data = [
      [10, 'C', 'Ferroviário', 'V', '2 – 0'], [11, 'F', 'Sporting Vale', 'E', '1 – 1'], [12, 'C', 'Náutico do Sul', 'V', '3 – 1'],
      [13, 'F', 'Atlético Marítimo', 'D', '0 – 2'], [14, 'C', 'Comercial FC', 'V', '1 – 0'], [15, 'C', 'Porto Oeste', '', 'Próximo jogo'],
      [16, 'F', 'Guarani Alto', '', 'A jogar'], [17, 'C', 'União Planalto', '', 'A jogar'], [18, 'F', 'Estrela do Norte', '', 'A jogar'],
    ];
    const games = data
      .filter((d) => filter === 'Todos' || (filter === 'Em casa' ? d[1] === 'C' : d[1] === 'F'))
      .map((d, i) => {
        const next = d[4] === 'Próximo jogo';
        const color = d[3] === 'V' ? '#3ddc84' : d[3] === 'D' ? '#ff8a8a' : '#b4c0cd';
        return {
          round: d[0], opponent: d[2], text: d[4], where: d[1] === 'C' ? 'Casa' : 'Fora', played: !!d[3],
          comp: d[0] < 13 ? 'Campeonato Estadual do Rio Grande do Sul' : 'Campeonato Nacional do Brasil',
          venue: 'flex:0 0 auto;min-width:48px;text-align:center;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:#16222c;color:' + (d[1] === 'C' ? accent : '#5ec8ff') + ';',
          result: 'flex:0 0 auto;min-width:96px;text-align:center;border-radius:8px;padding:4px 12px;font-weight:600;font-variant-numeric:tabular-nums;' +
            (d[3] ? 'background:#0f151c;color:' + color + ';' : next ? 'background:' + accent + ';color:#06140c;' : 'color:#98a6b6;'),
          rowStyle: 'display:flex;flex-wrap:wrap;align-items:center;gap:16px;min-height:60px;' + (i ? 'border-top:1px solid #1d2733;' : ''),
        };
      });
    return { accent, nav, filters, games };
  }
}
</script>
</body>
</html>
