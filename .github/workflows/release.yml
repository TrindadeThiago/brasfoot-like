name: release

# Publica na Vercel só depois de todos os gates (016 contracts/release.md).
# Segredos: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm --filter @brasfoot-like/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm sim:world --seasons 30
      - run: pnpm sim:economy --seasons 30
      - run: pnpm check-release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
      - name: Publicar na Vercel
        run: npx --yes vercel@62.5.0 deploy apps/web/out --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Notas da versão
        run: |
          node -e '
            const notes = require("./packages/i18n/locales/pt-BR/release-notes.json");
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const entry = notes.find((note) => note.version === version);
            if (!entry) { console.error("sem notas para " + version); process.exit(1); }
            console.log(entry.changes.map((change) => "- " + change).join("\n"));
          ' > release-notes.md
      - name: Release do GitHub
        run: gh release create "$GITHUB_REF_NAME" --title "Treinador FC $GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
