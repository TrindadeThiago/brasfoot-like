name: release

# Publica na Vercel depois dos gates baratos: tipos, lint, build e `check-release`. Os testes de
# unidade e o e2e já rodaram no PR (ci.yml), e as simulações de 30 temporadas rodam só localmente, no
# gancho de pré-push (`pnpm sim:gates`, `.githooks/pre-push`): repeti-las aqui só gastava minutos de
# Actions. O deploy usa exatamente o build conferido (artefato `site`).
# Dispara no push na `main`: se a versão do `package.json` ainda não tem tag `vX.Y.Z`, confere,
# publica e cria a tag e o Release do GitHub no fim. Versão já publicada = nada a fazer.
# Mudanças só de documentação não disparam (mesmos filtros do ci.yml). `workflow_dispatch` serve
# para refazer uma publicação que falhou antes de criar a tag.
# Segredos: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!*.md"
      - "!**/*.md"
      - "!docs/**"
      - "!specs/**"
      - "!.specify/**"
      - "!.claude/**"
      # Lidos pelos testes (packages/modkit/test/docs.test.ts) e publicados no site.
      - "docs/mod-format.md"
      - "apps/web/public/docs/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: A versão já tem tag?
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A tag v$version já existe: nada a publicar."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publicando a versão $version."
          fi

  # Um só job (uma instalação): tipos, lint, build e verificação do release.
  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build:web
      - name: Conferir a versão, as notas e o build
        run: pnpm check-release
        env:
          # A tag ainda não existe: informa a que será criada para a conferência valer.
          RELEASE_TAG: v${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/out/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: apps/web/out/
      - name: Publicar na Vercel
        run: npx --yes vercel@63.1.2 deploy apps/web/out --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Notas da versão
        run: |
          node -e '
            const notes = require("./packages/i18n/locales/pt-BR/release-notes.json");
            const version = process.env.VERSION;
            const entry = notes.find((note) => note.version === version);
            if (!entry) { console.error("sem notas para " + version); process.exit(1); }
            console.log(entry.changes.map((change) => "- " + change).join("\n"));
          ' > release-notes.md
      - name: Release do GitHub
        # Cria a tag `v$VERSION` no commit publicado e o Release, só depois do deploy.
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Treinador FC v$VERSION" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
