name: ci

# Jobs em paralelo: o runner de repositório privado tem 2 vCPUs, então os testes unitários são
# divididos em shards (arquivos distribuídos por hash) e o e2e roda num job próprio.
# Mudanças só de documentação (docs/, specs/, .specify/, .claude/ e arquivos .md) não rodam o
# CI; a ordem dos padrões importa: os últimos voltam a incluir o que é lido pelo código.
on:
  pull_request:
    paths:
      - "**"
      - "!*.md"
      - "!**/*.md"
      - "!docs/**"
      - "!specs/**"
      - "!.specify/**"
      - "!.claude/**"
      # Lidos pelos testes (packages/modkit/test/docs.test.ts) e publicados no site.
      - "docs/mod-format.md"
      - "apps/web/public/docs/**"
  push:
    branches: [main]
    paths:
      - "**"
      - "!*.md"
      - "!**/*.md"
      - "!docs/**"
      - "!specs/**"
      - "!.specify/**"
      - "!.claude/**"
      # Lidos pelos testes (packages/modkit/test/docs.test.ts) e publicados no site.
      - "docs/mod-format.md"
      - "apps/web/public/docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Com 2 vCPUs o Vitest usaria 1 worker por padrão.
      - run: pnpm test --shard=${{ matrix.shard }}/4 --maxWorkers=2

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm --filter @brasfoot-like/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
